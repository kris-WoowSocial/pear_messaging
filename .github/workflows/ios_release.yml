name: iOS Release to App Store

on:
  push:
    branches:
      - ios_production_main
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name (e.g. 1.2.1)"
        required: true
        default: "1.2.0"
      version_code:
        description: "Build number (e.g. 121)"
        required: true
        default: "120"

jobs:
  build_and_upload:
    name: Build & Upload to App Store
    runs-on: macos-15

    env:
      VERSION_NAME: ${{ github.event.inputs.version_name || '' }}
      VERSION_CODE: ${{ github.event.inputs.version_code || '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve version
        run: |
          # Read version from pubspec.yaml (format: "version: 1.4.0+4")
          PUBSPEC_VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //')
          PUBSPEC_NAME=$(echo "$PUBSPEC_VERSION" | cut -d'+' -f1)
          PUBSPEC_CODE=$(echo "$PUBSPEC_VERSION" | cut -d'+' -f2)

          # Use workflow_dispatch inputs if provided, otherwise use pubspec.yaml
          if [ -z "$VERSION_NAME" ]; then
            echo "VERSION_NAME=$PUBSPEC_NAME" >> $GITHUB_ENV
          fi
          if [ -z "$VERSION_CODE" ]; then
            echo "VERSION_CODE=$PUBSPEC_CODE" >> $GITHUB_ENV
          fi

          echo "Building version: ${{ env.VERSION_NAME || '$PUBSPEC_NAME' }} (${{ env.VERSION_CODE || '$PUBSPEC_CODE' }})"

      - name: Select Xcode 26
        run: |
          # List available Xcode versions and select Xcode 26
          ls /Applications/ | grep Xcode
          if [ -d "/Applications/Xcode_26.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.0.app/Contents/Developer
          elif [ -d "/Applications/Xcode_26.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.app/Contents/Developer
          else
            echo "Available Xcode versions:"
            ls /Applications/ | grep -i xcode
            echo "ERROR: Xcode 26 not found. Using latest available."
            LATEST_XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
            sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
          fi
          xcodebuild -version

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.8"
          channel: "stable"

      - name: Install Flutter iOS artifacts
        run: flutter precache --ios

      - name: Install dependencies
        run: flutter pub get

      - name: Import Apple Distribution Certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12

          echo "$CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Install Provisioning Profile
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          PP_PATH=$RUNNER_TEMP/profile.mobileprovision
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PP_PATH"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Configure manual signing for Release
        run: |
          perl -i -pe '
            BEGIN { $in = 0 }
            if (/97C147071CF9000F007C117D \/\* Release \*\//) { $in = 1 }
            if ($in && /name = Release;/) { $in = 0 }
            s/CODE_SIGN_IDENTITY = "Apple Development";/CODE_SIGN_IDENTITY = "Apple Distribution";/ if $in;
            s/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/ if $in;
            s/PROVISIONING_PROFILE_SPECIFIER = "";/PROVISIONING_PROFILE_SPECIFIER = "Vant_Chat_App_Store";/ if $in;
          ' ios/Runner.xcodeproj/project.pbxproj
          grep -A1 "CODE_SIGN_STYLE\|PROVISIONING_PROFILE_SPECIFIER\|CODE_SIGN_IDENTITY" ios/Runner.xcodeproj/project.pbxproj | head -20

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install

      - name: Build iOS Archive
        run: |
          flutter build ipa \
            --release \
            --target=lib/main_prod.dart \
            --build-name=${{ env.VERSION_NAME }} \
            --build-number=${{ env.VERSION_CODE }} \
            --export-options-plist=ios/ExportOptions.plist

      - name: Upload to App Store Connect
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          KEY_DIR=~/.appstoreconnect/private_keys
          KEY_PATH="$KEY_DIR/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          mkdir -p "$KEY_DIR"
          echo "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode > "$KEY_PATH"

          xcrun altool --upload-app \
            --type ios \
            --file build/ios/ipa/*.ipa \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Clean up keychain and provisioning profile
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/build.keychain 2>/dev/null || true
          rm -f ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision 2>/dev/null || true
          rm -f ~/.appstoreconnect/private_keys/AuthKey_*.p8 2>/dev/null || true
