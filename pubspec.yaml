name: pear_messaging
description: "Secure local chat application"
publish_to: "none"

version: 1.4.6+6

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.8

  # State Management
  get: ^4.6.6

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.3

  # Authentication
  local_auth: ^2.2.0

  # Networking
  socket_io_client: ^2.0.3+1
  connectivity_plus: ^6.0.0
  url_launcher: ^6.2.2

  # WebRTC for Audio Calling
  flutter_webrtc: ^0.12.12+hotfix.1
  sensors_plus: ^4.0.2
  flutter_callkit_incoming: ^2.0.3
  audioplayers: ^6.1.0
  flutter_ringtone_player: ^4.0.0+4
  flutter_background_service: ^5.0.5
  wakelock_plus: ^1.2.8
  proximity_sensor: ^1.3.3

  # Utilities
  intl: ^0.19.0
  uuid: ^4.4.0
  device_info_plus: ^10.1.0
  package_info_plus: ^8.0.0
  permission_handler: ^11.3.1
  path_provider: ^2.1.1
  country_picker: ^2.0.24
  android_intent_plus: ^5.0.2
  firebase_core: ^4.0.0
  firebase_crashlytics: ^5.0.0
  firebase_analytics: ^12.0.0
  firebase_messaging: ^16.0.0
  flutter_local_notifications: ^17.0.0

  # UI Components
  smooth_page_indicator: ^1.1.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.0.0

  # Deep Linking & Sharing
  flutter_branch_sdk: ^7.0.1
  share_plus: ^10.0.0
  http: ^1.1.0

  # In-App Updates & Reviews
  in_app_update:
  in_app_review: ^2.0.9
  flutter_rating_bar: ^4.0.1

  # Payments
  in_app_purchase: ^3.2.0

  # Image Handling & Compression
  image_picker: ^1.0.7
  photo_view: ^0.15.0

  # Image Compression
  flutter_image_compress: ^2.3.0
  cached_network_image: ^3.4.1

  # App Icon Badge
  app_badge_plus:

  # Cryptography
  cryptography: ^2.7.0

  # Secure Storage - Hardware-backed key management
  flutter_secure_storage: ^9.2.2

  # File Handling
  file_picker: ^8.0.3

  # Additional UI
  loading_animation_widget: ^1.2.0+8
  flutter_expandable_fab: ^2.5.2

  # Encryption handled internally (XOR) - Now using proper cryptography

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/audio/

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
